[build-system]
requires = ["setuptools>=68,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-runtime"
version = "0.1.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
agroctl = "agro_runtime.cli:main"

[tool.setuptools]
packages = ["agro_runtime"]

[tool.setuptools.package-dir]
"" = "src"
